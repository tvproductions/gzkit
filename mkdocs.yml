exclude_docs: |
  design/**
  proposals/**
  lodestar/**
  developer/**

validation:
  nav:
    omitted_files: info
  links:
    not_found: ignore
    absolute_links: info
    unrecognized_links: info
    anchors: info

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      # auto_title ensures `title` is always a string. Without it,
      # pymdownx.highlight passes filename=None to pygments.HtmlFormatter,
      # which crashes on pygments 2.20.0+ (html.escape(None) fails in the
      # hardened HTML formatter shipped with pygments/pygments#3071). See
      # GHI #281.
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tvproductions/gzkit

copyright: "The human is index zero."
