<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>gzkit general arrangement, 2026-10-17</title>
  <desc>The requirements catalog and the ADR as peers; a work package cut from either; task cards as increments; the Release Package ships work packages and the ledger release record is evidenced by task-card witnesses; the campaign sequences releases; the control plane and the standing maintenance mode are side rails.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="600" fill="#FFFFFF"/>

  <rect x="40" y="40" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="210" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">PRD</text>
  <text x="210" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Product intent: functional and non-functional</text>
  <line x1="140" y1="96" x2="140" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="126" width="200" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="140" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Requirements catalog</text>
  <rect x="56" y="166" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="140" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Feature areas</text>
  <text x="140" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">functional, non-functional</text>
  <rect x="56" y="218" width="168" height="44" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="140" y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">REQ</text>
  <text x="140" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">contract, state, feature files</text>

  <line x1="240" y1="201" x2="258" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="260" y="126" width="120" height="150" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="320" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">ADR</text>
  <text x="320" y="202" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">when a decision</text>
  <text x="320" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">is needed; lands</text>
  <text x="320" y="234" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">contracts on REQs</text>

  <line x1="140" y1="276" x2="140" y2="304" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="276" x2="320" y2="304" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="306" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="210" y="324" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Work package</text>
  <text x="210" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">REQs sharing one contract, from either</text>
  <line x1="210" y1="362" x2="210" y2="384" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="362" x2="80" y2="464" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="130" y="386" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="210" y="404" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Task card</text>
  <text x="210" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">one commit, one REQ witness</text>
  <line x1="280" y1="442" x2="280" y2="464" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="466" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="140" y="484" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Release Package</text>
  <text x="140" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">ships work packages; version</text>
  <rect x="260" y="466" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="320" y="484" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Release record</text>
  <text x="320" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">ledger: what shipped</text>
  <text x="210" y="546" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">The campaign sequences releases; a Release Package advances REQ states</text>

  <rect x="430" y="126" width="210" height="204" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="535" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Control plane</text>
  <text x="535" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Airlock slices by contract</text>
  <text x="535" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">GHI and MX classify by contract</text>
  <text x="535" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Eval checks design vs code</text>
  <text x="535" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Each control names its contract</text>
  <text x="535" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Every loaded surface budgeted</text>
  <text x="535" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Ledger is the record; human attests</text>

  <rect x="430" y="350" width="210" height="210" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="535" y="370" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Maintenance mode, standing</text>
  <text x="535" y="396" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">MX hangar, chores, patch releases</text>
  <text x="535" y="420" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">GHIs carry repair and refactor</text>
  <rect x="440" y="440" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="535" y="460" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Safe mode: occasional flip</text>
  <line x1="535" y1="480" x2="535" y2="498" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="500" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="535" y="520" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Drydock: repair orders as repair WPs</text>
</svg>
