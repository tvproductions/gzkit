# Ty configuration for gzkit

[environment]
python-version = "3.13"

# ty cannot narrow types after unittest assertIsNotNone(), and does not
# understand Pydantic alias/populate_by_name semantics.  Suppress the
# resulting false-positives in test code rather than littering every test
# with inline ignore comments.
[[overrides]]
include = ["tests/**"]

[overrides.rules]
unresolved-attribute = "ignore"
unknown-argument = "ignore"
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
unused-type-ignore-comment = "ignore"
possibly-missing-attribute = "ignore"

# behave's @given/@when/@then resolve to _StepDecorator instances that ty
# cannot see as callable; suppress the decorator false-positive in step glue
# rather than littering every step definition with inline ignore comments.
[[overrides]]
include = ["features/**"]

[overrides.rules]
call-non-callable = "ignore"

# timeout.py guards POSIX-only signal attributes (SIGALRM, setitimer,
# ITIMER_REAL) behind an `os.name == "nt"` call-site router and suppresses
# them with `# ty: ignore[unresolved-attribute]`. Those ignores are
# load-bearing on win32 (verified: `ty check --python-platform win32` passes
# only with them) but read as "unused" when the gate analyses against a POSIX
# host. Silence the host-dependent unused-ignore noise here without dropping
# the Windows-protective suppressions.
[[overrides]]
include = ["src/gzkit/complexity/advisor/timeout.py"]

[overrides.rules]
unused-ignore-comment = "ignore"
