default_stages: [pre-commit]
# prepare-commit-msg installs the TASK-trailer stamper (GHI #731). Without it,
# `pre-commit install` wires only pre-commit/pre-push and the stamper never runs.
# post-commit installs the commit-locus ledger backstop (GHI #847). Without it,
# `pre-commit install` wires no post-commit hook and a Bash-authored governance
# edit reaches Layer-2 having emitted nothing. Changing this list requires a
# re-run of `pre-commit install` -- an existing clone does not pick it up.
default_install_hook_types: [pre-commit, pre-push, prepare-commit-msg, post-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: task-trailer-stamp
        name: "stamp Task: trailers from active TASKs"
        entry: .gzkit/hooks/prepare-commit-msg-task-trailers
        language: system
        stages: [prepare-commit-msg]
        always_run: true
      - id: ruff-check
        name: ruff check (lint)
        entry: uv run ruff check --fix
        language: system
        pass_filenames: true
        types: [python]
        exclude: ^site/

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: true
        types: [python]
        exclude: ^site/

      - id: ty-check
        name: ty (static type check)
        # Scope must match CANONICAL_STEP_COMMANDS["typecheck"] in
        # src/gzkit/arb/validator.py — pinned by
        # tests/arb/test_typecheck_scope_lockstep.py, which reads this file.
        entry: uv run ty check . --exclude features
        language: system
        pass_filenames: false
        types: [python]
        exclude: ^site/

      - id: forbid-pytest
        name: forbid pytest (unittest-only policy)
        entry: uv run -m gzkit.hooks.guards
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: xenon-complexity
        name: xenon (enforce C/C/C complexity ceiling)
        entry: uv run xenon --max-absolute C --max-modules C --max-average C src/
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: interrogate
        name: interrogate (docstring coverage)
        entry: uv run interrogate -v -f 50 src/
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: surface-fidelity-cheap
        name: surface-fidelity cheap subset (invariants 1, 2, 3)
        entry: uv run gz validate --bullet-retention --surface-weight --pointer-anchors
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: validator-reachability-ratchet
        name: validator reachability (ungated scopes may only shrink)
        entry: uv run python src/gzkit/chores/control-surface-validator-reachability/check_reachability.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ledger-vocabulary-inertness
        name: ledger vocabulary (never-fired types must stay disclosed)
        entry: uv run python src/gzkit/chores/ledger-vocabulary-inertness/check_ledger_inertness.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: check-todos-fixmes
        name: check TODO/FIXME (flagged, informational)
        entry: bash -c 'grep -r "TODO\|FIXME" src/ tests/ --include="*.py" 2>/dev/null || true'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # ADR appendices are evidentiary primary sources (transcripts, adversary
      # verdicts, operator exhibits). A formatter that rewrites them makes the
      # archived copy differ from the original it exists to preserve, which is
      # the one property it must have. Exempt, not exempted-later.
      - id: end-of-file-fixer
        exclude: ^(site/|docs/design/adr/.*/appendices/)
      - id: trailing-whitespace
        exclude: ^(site/|docs/design/adr/.*/appendices/)
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets scanner)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: authorship
        name: authorship policy (commit identity)
        # Guards at COMMIT time, which is the moment the address is stamped into
        # a repo-bound artifact. `gz check` alone left the gap this closes: a
        # clone that only ever commits — no check, no push — would carry the
        # operator's personal email with nothing objecting, and AGENTS.md prices
        # that at a filter-repo rewrite plus a force-push (GHI #725).
        #
        # Cheap by construction: one `git config --get` and a suffix compare,
        # and a no-op entirely in projects that declare no policy — so adopters
        # pay nothing and inherit no identity rule of gzkit's.
        entry: uv run gz validate --authorship
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ledger-commit-locus
        name: "record governance edits the tool locus could not see"
        # POST-commit, not pre-commit. The event names the commit it observed
        # (AGENTS.md DO IT RIGHT: name the STATE, never a proxy), and a
        # pre-commit emitter would claim an edit was committed for a commit the
        # message editor or a later hook can still abort. Git ignores this
        # hook's exit status, which is correct -- a recorder gates nothing.
        entry: uv run -m gzkit.hooks.commit_ledger
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]

      - id: gz-check-pre-push
        name: gz check (pre-push gate)
        # --reuse-verified skips the run when this exact tree CONTENT already
        # passed a full check (GHI #835). A fix used to pay ~148s twice: once
        # when it was verified, then again here over an unchanged tree, where
        # the second run cannot reach a different verdict. Content-addressed,
        # so the intervening commit does not defeat it and any edit does; and
        # fail-open, so an unreadable repo runs the gate rather than skipping.
        entry: uv run gz check --reuse-verified
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Listed LAST on purpose. With fail_fast: true (top of file), a failure
      # in any cheap gate above — ruff, ty, xenon, interrogate,
      # surface-fidelity, gitleaks — aborts the run before this ~15s parallel
      # suite executes. Do not reorder this hook earlier: a cheap-gate failure
      # downstream of it cannot stop a run it has already started.
      - id: unittest
        name: unittest
        # unittest-parallel runs the stdlib unittest suite across worker
        # processes (41.34s wall vs 144.23s serial, 8,912 tests, 10-core host,
        # measured 2026-08-27). It is a PINNED `dev` dependency in
        # pyproject.toml, so this is `uv run unittest-parallel` — not `uvx`
        # (whose isolated env lacks gzkit/pydantic, which a test runner must
        # import) and no longer `uv run --with` (which re-resolved it from the
        # network on every run).
        #
        # This entry MUST equal `CANONICAL_STEP_COMMANDS["unittest"]`. It is the
        # one copy that cannot derive — YAML read by pre-commit before Python
        # runs — so it is pinned by equality instead, in
        # `tests/arb/test_unittest_runner_lockstep.py`. The prior comment here
        # justified `--with` as "matching the un-pinned xenon/gitleaks
        # precedent"; that precedent never existed (xenon is pinned above and
        # invoked as `uv run xenon`; gitleaks is a native binary), and the gap
        # between this hook and the attestation surface was GHI #856.
        # `--buffer` replays a test's output only when it fails or errors, so a
        # PASSING negative-path test no longer prints convincing fail-closed
        # prose into the log (GHI #723). Failures still show their own stderr.
        entry: uv run unittest-parallel -t . -s tests --buffer
        language: system
        pass_filenames: false
        types: [python]
        # CI-only by default: the full suite runs in CI (gz check) and in the
        # inner loop (scoped). Commits AND pushes stay fast (cheap gates only).
        # Run on demand with: pre-commit run unittest --hook-stage manual.
        stages: [manual]
        # Unit tests mock subprocess boundaries. End-to-end CLI behavior
        # is covered by behave under features/ — see .gzkit/rules/tests.md.
