[project]
name = "py-gzkit"
version = "0.34.9"
description = "GovZero Kit: A Development Covenant for Human-AI Collaboration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "g0" }
]
keywords = ["governance", "adr", "specification", "ai", "collaboration", "covenant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "jinja2>=3.1",
    "jsonschema>=4.26",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "rich>=15.0",
    "structlog>=26.1",
    # Stdlib-First named departure (ADR-0.32.0-gzkit-ontology § Decision;
    # GO-attested Phase-0 airlock-in 2026-07-02): networkx supplies the
    # MultiDiGraph + lateral/reachability traversal that stdlib graphlib
    # (a topological sorter only) cannot. Consumed by src/gzkit/ontology/.
    "networkx>=3.7",
    # Stdlib-First named departure (ADR-0.32.0-gzkit-ontology § Decision;
    # GO-attested Phase-0 airlock-in 2026-07-02): tree-sitter is the polyglot
    # source sensor that stdlib `ast` (Python-only) cannot be — gzkit is a
    # harness that runs on adopter codebases. Confined to the adapter in
    # src/gzkit/ontology/source.py per hexagonal-architecture.md.
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    # Stdlib-First named departures (ADR-0.0.27 § Decision; AGENTS.md
    # § STDLIB-FIRST DOCTRINE § "Existing dependencies inherit this rule").
    # Stdlib does not expose cyclomatic complexity, nesting depth, or class
    # cohesion. lizard is imported in-process only by
    # src/gzkit/complexity/lizard_adapter.py (the C/C/C ceiling, the advisor and
    # module size); cohesion runs as a measurement subprocess. Radon retired in
    # RO-9 tranche 4 (GHI #1183).
    "lizard>=1.24,<2.0",
    "cohesion>=1.2,<2.0",
]

[project.scripts]
gz = "gzkit.cli:main"

[project.urls]
Homepage = "https://gzkit.org"
Documentation = "https://gzkit.org"
Repository = "https://github.com/tvproductions/gzkit"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is py-gzkit; the one root module is gzkit. uv_build ships the
# whole module tree (it has no wheel includes), so the wheel's contents are this
# tree minus the excludes below and uv's own (`__pycache__`, `*.pyc`, `*.pyo`).
# Excludes are unanchored: an anchored `wheel-exclude` removed nothing on uv
# 0.13.1. `gz validate --distribution` predicts the wheel from this table.
module-name = "gzkit"
module-root = "src"
source-exclude = [".antigravitycli"]
wheel-exclude = ["gzkit/chores/*/proofs"]

[tool.uv]
# The one uv version this repository runs on, locally and in CI. uv refuses to
# run on any other version, and `astral-sh/setup-uv` installs exactly this one in
# every workflow, so the two cannot drift. Move it with the binary in the same
# pass (`gz-deps-upgrade` step 1): `uv self update`, then this line.
required-version = "==0.13.1"
# `uv sync` installs both groups by default, so the per-change gate, CI and the
# release all build the docs from the lock (RO-9 tranche 2).
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Every current Ruff rule, preview included (RO-9 tranche 4, ruled 2026-10-19:
# "all ruff rules up to date", "MAXX astral"), less the standing exceptions below.
# The findings the tree carried when the selection widened are held in
# data/ruff_baseline.json, a counted shrink-ratchet `gz lint` judges (ruled
# 2026-10-23, "b"; "Counted, gz-run (Rec.)"; "Own file (Rec.)"), so run
# `uv run gz lint`, not bare `ruff check`, for the gate's verdict. The families
# selected one by one before ALL, and why each was adopted, are recorded in
# docs/governance/advisory-rules-audit.md (rows 18, 41 and 44 for BLE, PTH and
# S602; D by the 2026-08-01 ruling; C901 by GHI #1183).
select = ["ALL"]
preview = true
ignore = [
    # D203/D211 and D212/D213 are mutually exclusive pairs; ruff warns on every
    # run until one of each is disabled. Keep D211 (no blank line before class)
    # and D212 (multi-line summary on the first line) — both match the docstrings
    # already in the tree.
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # Standing exceptions ruled for tranche 4 (2026-10-22, "PT + COM812 + CPY001
    # (Rec.)"): pytest idioms, where unittest is doctrine (AGENTS.md § STDLIB-FIRST);
    # a trailing-comma rule that conflicts with Ruff's formatter; and copyright
    # headers, for which no doctrine exists.
    "PT",
    "missing-trailing-comma",
    "missing-copyright-notice",
    # Flags every `# noqa`, where .gzkit/rules/pythonic.md § Error Handling requires
    # a justified one at a genuine boundary; RUF100 already refuses a stale one
    # (ruled 2026-10-23, "RUF105 exception (Rec.)").
    "noqa-comments",
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# Hook-script generators hold hook bodies as indented string literals that are
# dedented on emit, so a source line is `indent` chars wider than the line it
# produces. The emitted file under .claude/hooks/ is itself ruff-formatted at
# line-length 100; wrapping the template to satisfy E501 *here* makes the
# generated file disagree with `gz agent sync control-surfaces`, which
# `gz validate --surfaces` then fails closed on. The emitted width is the one
# that must hold. Inline `# noqa` is unavailable: these lines are string
# content, so the comment would land in the generated hook. (GHI #582 follow-on.)
"src/gzkit/hooks/scripts/*.py" = ["line-too-long"]
# pydocstyle is adopted for the shipped package only — that is the surface the
# `pep257-docstring-compliance` chore gates (`ruff check src/gzkit --select D`).
# Extending it to tests/features/scripts would surface 6321 pre-existing findings
# in one step, which is a separate decision, not a side effect of this one.
#
# BLE001 rides these same three keys, for the same shipped-package-only reason
# plus one specific to it. `.gzkit/rules/pythonic.md` § Error Handling scopes the
# prohibition "outside CLI boundaries", and every surface excluded here IS such a
# boundary: SessionStart hooks and orientation scripts are documented never-raise
# ("a hook that dies takes the orientation down with it"), and test scaffolding
# catches broadly to assert a red phase. The generated hook mirrors below are
# additionally UNFIXABLE at their own path — they are emitted from string
# templates in `src/gzkit/hooks/scripts/`, so an inline `# noqa` cannot be
# written where the diagnostic fires, the same constraint the E501 entry above
# records. The six live violations inside `src/gzkit` were FIXED, not excluded
# (2026-08-08 operator ruling: enable BLE001, defer PLC0415).
#
# PTH rides these same keys, for the shipped-package-only reason alone — 102 of
# its 119 tree-wide findings sit outside the package (87 in tests, 7 in the
# generated `.claude/hooks` mirrors, 3 in behave steps, 2 in profiling scripts),
# and adopting them in one step is a separate decision, not a side effect of
# making row 41 true. The 17 inside `src/gzkit` were FIXED, not excluded
# (2026-08-08 operator ruling: enable PTH, package-scoped).
#
# Under ALL, tests, features and scripts also carry the curation list ruled for
# tranche 4 (2026-10-22, "Package-strict, tests curated (Rec.)"): annotations,
# private access (attribute and import), `assert`, no-self-use and unused arguments, the idioms of test
# scaffolding and behave steps rather than defects in them.
"tests/**/*.py" = ["D", "BLE", "PTH", "ANN", "private-member-access", "import-private-name", "assert", "no-self-use", "ARG"]
"features/**/*.py" = ["D", "BLE", "PTH", "ANN", "private-member-access", "import-private-name", "assert", "no-self-use", "ARG"]
"scripts/**/*.py" = ["D", "BLE", "PTH", "ANN", "private-member-access", "import-private-name", "assert", "no-self-use", "ARG"]
".claude/hooks/*.py" = ["BLE", "PTH"]
".github/copilot/hooks/*.py" = ["BLE", "PTH"]
# Canonical skill helper scripts and their generated vendor mirrors, plus the
# generated hook scripts. Mirrors are written by `gz agent sync control-surfaces`
# and must never be hand-edited (.gzkit/rules/skill-surface-sync.md #4/#5), so a
# docstring rule over them would gate on files no one may fix in place.
".gzkit/**/*.py" = ["D"]
".claude/**/*.py" = ["D"]
".github/**/*.py" = ["D"]
".agents/**/*.py" = ["D"]
# Dated evidence scripts are sealed records of what a past audit ran; refactoring
# one to satisfy a ceiling adopted later would rewrite the evidence it is (RO-9
# tranche 4, the C901 ceiling at 20).
".gzkit/evidence/*.py" = ["complex-structure"]
"docs/governance/*-evidence/*.py" = ["complex-structure"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# ruff 0.16 began formatting Python code blocks inside Markdown. gzkit's Markdown
# is not incidental prose — `.gzkit/rules/**`, its vendor mirrors, and the ADR/OBPI
# corpus ARE governed surfaces, budgeted by `gz validate --surface-fidelity`
# against `data/surface_weight_floor.json`. Letting the formatter insert blank
# lines into their fenced examples grew the corpus by 742 lines in one pass and
# pushed it from the floor (1859) into the yellow band (2601), which demands a
# waiver for churn that carries no governance meaning. Excluded so the formatter
# owns Python files and the surface budget owns Markdown.
exclude = ["*.md"]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "cohesion>=1.2.0",
    "coverage>=7.16.2",
    "lizard>=1.24.0",
    "pyinstaller>=6.22.0",
    "ruff>=0.17.1",
    # Tracks ty forward, never pinned backward. Operator ruling 2026-08-09: "we
    # progress as Ty progresses, if it has become more strict, then we tighten
    # up, do not avoid hard work by clinging to older version of Ty." The 88
    # diagnostics 0.0.69 surfaced were latent defects the older release could not
    # see, so the checker moving is the signal to fix the code (GHI #789).
    "ty>=0.0.89",
    # Pinned here rather than fetched via `uv run --with` (operator ruling
    # 2026-08-27, GHI #856). It backs the canonical "Tests pass" attestation
    # (`CANONICAL_STEP_COMMANDS["unittest"]`), and an ARB receipt is durable
    # EVIDENCE -- it must not rest on a runner resolved from the network at run
    # time, whose version is whatever `uv` picked that day. Pinning is what
    # discharges that objection; it is also plain conformance, not a departure:
    # every other Python verifier in this toolchain (ruff, ty, behave, coverage,
    # lizard) is pinned here and invoked as `uv run <tool>`. The
    # "un-pinned xenon/gitleaks precedent" cited when the accelerator was adopted
    # (GHI #512) never existed -- xenon was pinned here until RO-9 tranche 4
    # retired it, and gitleaks is a native binary rather than a Python package.
    "unittest-parallel>=1.8.6",
]
# The docs build's own tooling, local-only like `dev` (RO-9 tranche 2). Read the
# Docs syncs this group alone; every other sync gets it through `default-groups`.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

# GHI #256: scope coverage to src/gzkit so ephemeral tempdir sources under
# .claude/hooks/, features/, etc. don't pollute .coverage with missing-source
# errors after tests clean up their isolated filesystems.
[tool.coverage.run]
source = ["src/gzkit"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
