[project]
name = "py-gzkit"
version = "0.33.3"
description = "GovZero Kit: A Development Covenant for Human-AI Collaboration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [
    { name = "Jeffry" }
]
keywords = ["governance", "adr", "specification", "ai", "collaboration", "covenant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "jinja2>=3.1",
    "jsonschema>=4.26",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "rich>=15.0",
    "structlog>=26.1",
    # Stdlib-First named departure (ADR-0.32.0-gzkit-ontology § Decision;
    # GO-attested Phase-0 airlock-in 2026-07-02): networkx supplies the
    # MultiDiGraph + lateral/reachability traversal that stdlib graphlib
    # (a topological sorter only) cannot. Consumed by src/gzkit/ontology/.
    "networkx>=3.4",
    # Stdlib-First named departure (ADR-0.32.0-gzkit-ontology § Decision;
    # GO-attested Phase-0 airlock-in 2026-07-02): tree-sitter is the polyglot
    # source sensor that stdlib `ast` (Python-only) cannot be — gzkit is a
    # harness that runs on adopter codebases. Confined to the adapter in
    # src/gzkit/ontology/source.py per hexagonal-architecture.md.
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    # Stdlib-First named departures (ADR-0.0.27 § Decision; AGENTS.md
    # § STDLIB-FIRST DOCTRINE § "Existing dependencies inherit this rule").
    # Stdlib does not expose cyclomatic complexity, nesting depth, or LCOM4;
    # these deps are corpus-measurement-only and consumed exclusively by
    # src/gzkit/complexity/measurement.py.
    "radon>=6.0,<7.0",
    "lizard>=1.23,<2.0",
    "cohesion>=1.2,<2.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
]

[project.scripts]
gz = "gzkit.cli:main"

[project.urls]
Homepage = "https://gzkit.org"
Documentation = "https://gzkit.org"
Repository = "https://github.com/tvproductions/gzkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".antigravitycli",
    ".antigravitycli/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gzkit"]
include = [
    "src/gzkit/chores/**/*.md",
    "src/gzkit/chores/**/*.json",
    "src/gzkit/chores/README.md",
    "src/gzkit/chores/registry.json",
    "src/gzkit/skills/**/*.md",
    "src/gzkit/rules/**/*.md",
    "src/gzkit/rules/**/*.json",
    "src/gzkit/personas/**/*.md",
    "src/gzkit/templates/**/*.md",
    "src/gzkit/hooks/scripts/**",
]
exclude = [
    ".antigravitycli",
    ".antigravitycli/**",
    "**/__pycache__",
    "**/__pycache__/**",
    "**/*.pyc",
    "src/gzkit/chores/*/proofs",
    "src/gzkit/chores/*/proofs/**",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "behave>=1.3.3",
    "cohesion>=1.2.0",
    "coverage>=7.14.3",
    "detect-secrets>=1.5.0",
    "interrogate>=1.7.0",
    "lizard>=1.23.0",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
    "pygount>=3.2.0",
    "pyinstaller>=6.21.0",
    "radon>=6.0.1",
    "ruff>=0.15.20",
    "ty>=0.0.52",
    "vulture>=2.16",
    "wily>=1.12.2",
    "xenon>=0.9.3",
]

# GHI #256: scope coverage to src/gzkit so ephemeral tempdir sources under
# .claude/hooks/, features/, etc. don't pollute .coverage with missing-source
# errors after tests clean up their isolated filesystems.
[tool.coverage.run]
source = ["src/gzkit"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
