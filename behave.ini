[behave]
# Skip work-in-progress scenarios by default. Run them explicitly with
# `behave --tags=wip`. @wip marks scenarios whose step definitions are not yet
# authored, so they do not block pre-merge gates.
# Advisory: name a tracking reference (GHI / OBPI) at the feature header. No
# code reads that reference, so a @wip block does not expire when its
# reference closes: retire it by hand then (operator ruling, GHI #1085).
default_tags = ~@wip
