# Release workflow — triggers on version tags (vX.Y.Z)
# Builds PyInstaller binaries for Windows/Linux/macOS, creates GitHub Release,
# and optionally publishes to PyPI.
#
# Usage (see docs/developer/release_process.md for the full ceremony):
#   gh release create vX.Y.Z --target main --latest --notes-file <curated notes>
#
# The release is created from curated notes BEFORE the tag reaches the remote;
# this workflow then attaches the built binaries to it. Pushing a bare tag with
# no release present still works and falls back to generated notes.
#
# Re-pushing a tag that is already fully released is a no-op: the release body
# is never rewritten, binaries already attached are left alone, and a version
# PyPI already holds is not published again (GHI #834).
#
# PyPI: `dist` builds the sdist and wheel with `uv build --no-sources` and
# smoke-tests them; `pypi` alone holds the publishing credential, generates
# PEP 740 attestations and runs `uv publish` (RO-9 tranche 3).
#
# Publishing an existing tag to PyPI after its tag-push run failed:
#   gh workflow run release.yml --ref main -f tag=vX.Y.Z
# A tag push runs the workflow file AT the tag, so a fix landed on main never
# reaches a re-run of that push. A dispatch runs this file from main, checks out
# the named tag, and runs only the PyPI jobs: the binaries and the release body
# belong to the tag-push run and are left alone.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to PyPI (vX.Y.Z)"
        required: true
        type: string

# Read-only by default; each job that writes asks for exactly what it writes.
# The publishing credential (`id-token: write`) is held by the `pypi` job alone,
# never by a job that builds (uv's GitHub guide; RO-9 tranche 3).
permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: gz.exe
            pyinstaller-name: gz.exe
          - os: ubuntu-latest
            artifact: gz-linux
            pyinstaller-name: gz
          - os: macos-latest
            artifact: gz-macos
            pyinstaller-name: gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # PyInstaller is already in the locked `dev` group; `uv add` here rewrote
      # pyproject.toml inside CI (RO-9 tranche 2).
      - name: Install dependencies
        run: uv sync --locked

      - name: Build binary
        run: uv run pyinstaller gz.spec

      - name: Rename artifact (skip if same name)
        shell: bash
        run: |
          if [[ "${{ matrix.pyinstaller-name }}" != "${{ matrix.artifact }}" ]]; then
            mv "dist/${{ matrix.pyinstaller-name }}" "dist/${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the release and attaches its binaries

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # A tag push is not the same event as a first release. Tag repair, a
      # workflow re-run, a force-pushed tag, or a mis-typed `git push --tags`
      # all re-enter this job with the release already published, and the
      # publishing step used to rewrite whatever it was handed while reporting
      # success -- so the destructive half was the silent half (GHI #834).
      #
      # Two facts, both measured 2026-08-19, decide the shape of this guard:
      #
      #   1. The release object ALREADY EXISTS on the normal path. The ceremony
      #      in docs/developer/release_process.md runs `gh release create
      #      --notes-file RELEASE_NOTES.md` before pushing the tag -- v0.34.4
      #      was published 12:14:23Z and this workflow started 12:14:25Z. So
      #      "a release exists" cannot mean "skip", or no release would ever
      #      receive binaries again.
      #   2. Assets are ours alone, and re-running replaced them. The 2026-08-19
      #      re-push of v0.18.1 and v0.24.1 overwrote their March/April binaries
      #      with fresh builds (asset created_at moved to 2026-08-19T01:34Z).
      #
      # So the discriminator is the artifact set: this workflow is the only
      # producer of these three files, and a release already carrying all of
      # them has already been served. Body writes are gated on the release
      # being absent; asset writes on the artifact set being incomplete.
      - name: Decide what this tag still needs
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Must equal the `artifact` values in the build matrix above, sorted.
          want="gz-linux,gz-macos,gz.exe"

          # First fence: serve only the version `main` currently declares. A
          # historical tag re-pushed for reachability repair (GHI #832) must be
          # left exactly as it stands, body AND assets -- and several of those
          # releases carry no assets at all, so the artifact check below would
          # otherwise read them as "still owed binaries" and upload today's
          # build onto a release from March.
          git fetch --depth=1 origin main
          main_version="$(git show FETCH_HEAD:pyproject.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [ "${GITHUB_REF_NAME#v}" != "$main_version" ]; then
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "attach=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is not the version main declares ($main_version). Leaving its release untouched."
            exit 0
          fi

          # Second fence: what does this tag still need?
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "create=true" >> "$GITHUB_OUTPUT"
            echo "attach=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "create=false" >> "$GITHUB_OUTPUT"
          have="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name] | sort | join(",")')"
          if [ "$have" = "$want" ]; then
            echo "attach=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $GITHUB_REF_NAME already carries every built artifact. Leaving its body and assets untouched."
          else
            echo "attach=true" >> "$GITHUB_OUTPUT"
          fi

      # `gh` rather than a marketplace action: what an action does to the body
      # of an ALREADY-EXISTING release is exactly the behaviour this issue is
      # about, and it is not something a reader of this file can verify. These
      # verbs are documented and each touches one thing.
      - name: Create the release when this tag has none
        if: steps.existing.outputs.create == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "gzkit $GITHUB_REF_NAME" --generate-notes

      - name: Attach built binaries
        if: steps.existing.outputs.attach == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            artifacts/gz.exe/gz.exe \
            artifacts/gz-linux/gz-linux \
            artifacts/gz-macos/gz-macos

  # The distributions are built here and published by `pypi` below, so the
  # job holding the publishing credential runs no build (RO-9 tranche 3).
  dist:
    needs: build
    # A dispatch skips `build`; publish then rests on the tag alone.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          # refs/tags/ makes a dispatch that names a branch or a typo fail here.
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        run: uv python install

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG_VERSION="$(uv version --short)"
          echo "Tag version: $TAG"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch — tag v$TAG vs pyproject.toml $PKG_VERSION. Refusing to publish."
            exit 1
          fi

      # v0.34.8 was tagged with Codex runtime symlinks under .codex/tmp that point
      # at an absolute host path; `uv build` refuses them when it unpacks the
      # sdist to build the wheel. Main no longer tracks them
      # (tests/governance/test_tracked_symlinks.py), but a tag is immutable.
      - name: Drop Codex runtime scratch the tag may carry
        run: rm -rf .codex/tmp

      # --no-sources: the package must build as an index would build it, with
      # `tool.uv.sources` disabled (uv's packaging guide).
      - name: Build the sdist and wheel
        run: uv build --no-sources

      # In place of `twine check`, which uv has no counterpart for: install each
      # distribution into a throwaway environment and run the CLI it declares.
      - name: Smoke-test the built distributions
        shell: bash
        run: |
          set -euo pipefail
          uv run --isolated --no-project --with dist/*.whl gz --help > /dev/null
          uv run --isolated --no-project --with dist/*.tar.gz gz --help > /dev/null

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: dist
    if: ${{ !cancelled() && needs.dist.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read   # checkout, so setup-uv reads `required-version`
      id-token: write  # trusted publishing and the attestations
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # PyPI files are immutable and a rebuilt distribution is not byte-identical,
      # so `uv publish` refuses a version PyPI already holds where the retired
      # action's `skip-existing` passed it (observed 2026-10-22: 0.34.9 rebuilt,
      # "Local file and index file do not match"). Re-pushing a released tag
      # (tag repair, a re-run) must stay a no-op (GHI #834), so a published
      # version is skipped here, before anything is attested or uploaded.
      - name: Skip a version PyPI already holds
        id: published
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/py-gzkit/${version}/json")"
          if [ "$status" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::py-gzkit ${version} is already on PyPI. Nothing to publish."
          elif [ "$status" = "404" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PyPI answered HTTP ${status} for py-gzkit ${version}; cannot tell whether it is published. Re-run the job."
            exit 1
          fi

      # uv uploads attestations but does not generate them; this action writes
      # the PEP 740 `.publish.attestation` files uv picks up beside each file.
      - name: Generate PEP 740 attestations
        if: steps.published.outputs.skip == 'false'
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish to PyPI
        if: steps.published.outputs.skip == 'false'
        run: uv publish --trusted-publishing always
