name: Docs

on:
  release:
    types: [published]
  workflow_dispatch:

# One build, two destinations. gzkit.org is served from a DigitalOcean droplet
# (deploy-vps, GHI #802); GitHub Pages stays as the mirror (deploy). No gh-pages
# branch push (retired peaceiris/actions-gh-pages@v4). Server setup and the
# secrets deploy-vps reads: docs/developer/deployment.md.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel an in-flight publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

# uv refuses to install a package OSV names as malware (MAL- advisories) before
# syncing; CI and release are where a new locked version is first installed
# (RO-9 tranche 5, operator ruling 2026-10-28; `gz validate --astral-discipline`).
env:
  UV_MALWARE_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Through setup-uv, as every other workflow does: it installs the version
      # `pyproject.toml` pins, where the shell installer takes whatever is latest.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The docs tooling is the locked `docs` group, synced by default (RO-9 tranche 2).
      - name: Sync dependencies
        run: uv sync --locked

      - name: Build docs (strict)
        run: uv run -m mkdocs build --strict

      # What the freshness check compares against the latest release (GHI #802).
      - name: Stamp build info
        run: |
          tag="${{ github.event.release.tag_name }}"
          [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0)
          printf '{"tag": "%s", "sha": "%s"}\n' "$tag" "${{ github.sha }}" > site/build-info.json

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-vps:
    needs: build
    # Skipped until the operator sets the VPS_HOST repository variable.
    if: ${{ vars.VPS_HOST != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: "vps"
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: ./site

      - name: Install deploy key and pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is restricted server-side by rrsync to /var/www/gzkit.org/site,
      # so the remote path is relative to that directory.
      - name: Rsync site to the droplet
        run: |
          rsync -rlz --delete --checksum \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./site/ "deploy@${{ vars.VPS_HOST }}:./"

      - name: Verify the served build
        run: |
          expected=$(cat site/build-info.json)
          served=$(curl -fsS "https://${{ vars.VPS_HOST }}/build-info.json")
          echo "expected: $expected"
          echo "served:   $served"
          [ "$expected" = "$served" ]
