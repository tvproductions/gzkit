name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "RELEASE_NOTES.md"
      - "README.md"
      # Transitive-dep changes reach the mkdocs build through uv.lock and
      # the `docs` optional-dependency group in pyproject.toml. Without
      # these entries, dependabot PRs that bump docs-critical libraries
      # (pygments, pymdown-extensions, mkdocs-material, markdown, etc.)
      # merge without ever exercising `mkdocs build --strict`, and the
      # first strict build runs post-merge on main — exactly the path
      # that produced the GHI #281 regression. See GHI #282.
      - "uv.lock"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Install docs dependencies
        run: uv pip install -r requirements-docs.txt

      - name: Build docs (strict)
        run: uv run -m mkdocs build --strict

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
