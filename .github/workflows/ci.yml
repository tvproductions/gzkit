name: CI

# Full gate runs server-side so the local loop can stay light.
# Locally: ruff + ty + `gz test --obpi <id>` (~3s) for iteration;
# `gz check` is the heavy sweep and belongs here, not on every keyboard.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows is in the matrix because `.claude/rules/cross-platform.md` declares
    # "Windows, macOS, Linux — co-equal" and, until 2026-08-09, CI ran only
    # ubuntu-latest. Four separate cross-platform defects reached main behind that
    # gap — GHI #383 (backslashes in compared paths), #275 (Windows console
    # encoding), #582 (cp1252 subprocess decode), #681 (CRLF in generated
    # surfaces) — each found by hand on an operator's Windows clone, each
    # catchable by one Windows run. `release.yml` already builds windows-latest
    # binaries, so the platform was shipped without its gate ever running.
    #
    # macOS is deliberately absent: it bills at 10x Linux minutes against
    # Windows's 2x, and shares POSIX path/newline semantics with Linux, so it
    # would add cost without covering a distinct failure class. Revisit if a
    # macOS-only defect is ever observed.
    strategy:
      fail-fast: false # a Windows-only failure must not mask a Linux one
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gz check has git-history-dependent validators

      # `gz check` runs the authorship audit (GHI #725), which fails closed when
      # no git identity resolves — and a fresh Actions checkout sets none. This is
      # the exact case the audit was written for: identity is machine state the
      # repository "can neither see, provision, nor verify."
      #
      # The bot identity, NOT the operator's: CI is not `g0`, and stamping the
      # operator's address on runner activity would misattribute machine work to a
      # human. The address must end in the suffix declared by `.gzkit.json`
      # (`authorship.required_email_suffix`), which the noreply form satisfies.
      - name: Configure git identity for the authorship audit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"

      # Astral's own action rather than the shell installer: the `install.sh`
      # curl form is POSIX-only, and hand-rolling the PowerShell branch plus its
      # PATH export is the kind of per-platform special-casing this matrix exists
      # to stop writing. Same vendor as uv/ruff/ty, so it adds no new trust
      # boundary the toolchain does not already sit behind.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Run gz check (full gate — lint, format, typecheck, test, behave, validators)
        run: uv run gz check
