name: CI

# Full gate runs server-side so the local loop can stay light.
# Locally: ruff + ty + `gz test --obpi <id>` (~3s) for iteration;
# `gz check --full` is the heavy sweep and belongs here, not on every keyboard;
# plain `gz check` is the per-change gate (GHI #1088). Since GHI #1191 that gate
# runs only the tests a change touches, so this job is where the whole unit
# tier, behave, the docs build and the guard-canary sweep run on every push.
on:
  push:
    branches: [main]
    # A push that changes nothing but session records does not run the sweep.
    # These three paths are what a `gz git-sync` governance commit carries (a
    # handoff or exit bookmark, the ruling store, an insight row, ledger rows),
    # and each such push cost a full two-platform run of about twenty minutes
    # for a markdown file. The filter applies only when EVERY changed file
    # matches, so a push that also touches code, docs or a workflow still runs.
    # What is given up: these files are validated server-side only at the next
    # push that is not ignored. The pre-push `gz check` still validates them
    # locally on every sync.
    paths-ignore:
      - ".gzkit/handoffs/**"
      - ".gzkit/insights/**"
      - ".gzkit/ledger.jsonl"
  pull_request:

permissions:
  contents: read

# A newer push supersedes the run in flight on the same ref (GHI #1254). On
# 2026-10-16, 11 of 15 runs on main started while the previous run was still
# going, each a full two-platform sweep judging a tree nobody would ship.
# The group is per workflow and ref, so a pull request cancels only its own
# older runs and never a run on main.
# What is given up: an intermediate commit on main superseded before its run
# ends gets no CI verdict of its own; the next run judges the combined tree.
# The pre-push `gz check` still runs locally on every push. Operator ruling,
# 2026-10-16, verbatim: "cancel superseded runs is fine".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows is in the matrix because `.claude/rules/cross-platform.md` declares
    # "Windows, macOS, Linux — co-equal" and, until 2026-08-09, CI ran only
    # ubuntu-latest. Four separate cross-platform defects reached main behind that
    # gap — GHI #383 (backslashes in compared paths), #275 (Windows console
    # encoding), #582 (cp1252 subprocess decode), #681 (CRLF in generated
    # surfaces) — each found by hand on an operator's Windows clone, each
    # catchable by one Windows run. `release.yml` already builds windows-latest
    # binaries, so the platform was shipped without its gate ever running.
    #
    # macOS is deliberately absent: it bills at 10x Linux minutes against
    # Windows's 2x, and shares POSIX path/newline semantics with Linux, so it
    # would add cost without covering a distinct failure class. Revisit if a
    # macOS-only defect is ever observed.
    strategy:
      fail-fast: false # a Windows-only failure must not mask a Linux one
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gz check has git-history-dependent validators

      # `gz check` runs the authorship audit (GHI #725), which fails closed when
      # no git identity resolves — and a fresh Actions checkout sets none. This is
      # the exact case the audit was written for: identity is machine state the
      # repository "can neither see, provision, nor verify."
      #
      # The bot identity, NOT the operator's: CI is not `g0`, and stamping the
      # operator's address on runner activity would misattribute machine work to a
      # human. The address must end in the suffix declared by `.gzkit.json`
      # (`authorship.required_email_suffix`), which the noreply form satisfies.
      - name: Configure git identity for the authorship audit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Astral's own action rather than the shell installer: the `install.sh`
      # curl form is POSIX-only, and hand-rolling the PowerShell branch plus its
      # PATH export is the kind of per-platform special-casing this matrix exists
      # to stop writing. Same vendor as uv/ruff/ty, so it adds no new trust
      # boundary the toolchain does not already sit behind.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Run gz check --full (lint, format, typecheck, test, behave, validators, canary sweep)
        if: runner.os != 'Windows'
        run: uv run gz check --full

      # Windows runs the full sweep minus the steps whose verdict no platform can
      # change, which this run's Linux job already returns (GHI #1253). The scope
      # and its per-step reasons are declared in `src/gzkit/check_step_scopes.json`
      # (`cross-platform`): every step that reads paths, spawns a subprocess,
      # decodes output or compares bytes stays, because that is the class this
      # platform is in the matrix to catch. Measured on CI run 38875151441 (a dated
      # record): the guard-canary sweep took 280.51s here and ran after the unit
      # tier finished, directly on the critical path.
      - name: Run gz check --cross-platform (the full sweep minus platform-independent steps)
        if: runner.os == 'Windows'
        run: uv run gz check --cross-platform
