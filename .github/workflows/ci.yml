name: CI

# Full gate runs server-side so the local loop can stay light.
# Locally: ruff + ty + `gz test --obpi <id>` (~3s) for iteration;
# `gz check` is the heavy sweep and belongs here, not on every keyboard.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gz check has git-history-dependent validators

      # `gz check` runs the authorship audit (GHI #725), which fails closed when
      # no git identity resolves — and a fresh Actions checkout sets none. This is
      # the exact case the audit was written for: identity is machine state the
      # repository "can neither see, provision, nor verify."
      #
      # The bot identity, NOT the operator's: CI is not `g0`, and stamping the
      # operator's address on runner activity would misattribute machine work to a
      # human. The address must end in the suffix declared by `.gzkit.json`
      # (`authorship.required_email_suffix`), which the noreply form satisfies.
      - name: Configure git identity for the authorship audit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Run gz check (full gate — lint, format, typecheck, test, behave, validators)
        run: uv run gz check
