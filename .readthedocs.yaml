# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# Trigger contract (release-only docs builds): mirrors the GitHub Actions
# `.github/workflows/docs.yml` `on: release: published` trigger. Achieving
# parity with GH Actions requires BOTH the file-level backstop below AND
# three one-time toggles in the RTD project admin UI — RTD's webhook
# subscription is admin-side, not file-side, so .readthedocs.yaml alone
# cannot prevent webhook ingestion.
#
# RTD admin (one-time, https://app.readthedocs.org/projects/gzkit/):
#   1. Settings → Default version = `stable`  ← DO THIS ONE FIRST
#      `latest` tracks a BRANCH, and the pre_build hook below cancels every
#      branch build — so an active `latest` can never rebuild and freezes at
#      whatever it held when the hook landed. Leaving it as the default points
#      both front doors (gzkit.readthedocs.io AND the gzkit.org custom domain,
#      which serves default_version) at permanently stale docs.
#   2. Settings → uncheck "Build versions automatically"
#      (stops RTD from auto-building newly pushed branches at ingestion)
#   3. Versions → mark every branch-version Inactive, `latest` INCLUDED.
#      Activate only the tag versions you want published.
#   4. Automation Rules → add rule: match=tag, version-type=tag,
#      action="Activate version + Build". OPTIONAL: this publishes per-version
#      archives at /en/vX.Y.Z/. `stable` already rebuilds on every new tag
#      without it, because `stable` is version-type=tag and so survives the
#      pre_build cancel.
#
# After those toggles, RTD short-circuits non-release webhooks at ingestion
# (cheap). The pre_build hook below remains as belt-and-suspenders so the
# file-level contract is enforced even if the admin config drifts.
#
# The four toggles above are tracked at GHI #801 — open by credential boundary,
# not by omission. They are dashboard-only: RTD's config-file v2 schema has no
# `default_version` key, so no edit to THIS file can apply them.
#
# MEASURED 2026-08-13 (none of the toggles above had been applied):
#   - 71 tag versions exist; every one is active=False, built=False.
#   - `stable` (type=tag) builds successfully on each new tag — last success
#     2026-08-12. It is the ONLY current surface, and the README badge is
#     correctly pointed at /en/stable/.
#   - `latest` (type=branch, and default_version) has had EVERY build cancelled
#     since the pre_build hook landed 2026-05-05 (f643fcab6). A doc page added
#     after that date returns 404 on /en/latest/ and 200 on /en/stable/.
#   - Every push to main still triggers a build that is then cancelled — 1383
#     builds recorded, which is toggle 2 not being applied.
#
# The RTD API v3 is PUBLICLY READABLE for this project; no token is needed to
# re-measure any of the above, and an earlier claim that it returns 403
# unauthenticated is false (it blocked this check twice):
#   curl -s https://app.readthedocs.org/api/v3/projects/gzkit/versions/?active=true
#   curl -s https://app.readthedocs.org/api/v3/projects/gzkit/builds/
# Only the WRITE side (applying the toggles) needs operator credentials.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # Skip non-tag builds (branch pushes) so RTD only rebuilds on releases.
    # Exit code 183 is RTD's documented "cancel build" signal.
    # See https://docs.readthedocs.io/en/stable/build-customization.html#cancel-build-based-on-a-condition
    pre_build:
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" != "tag" ]; then
          echo "Skipping non-tag build (READTHEDOCS_VERSION_TYPE=$READTHEDOCS_VERSION_TYPE)"
          exit 183
        fi
    install:
      - pip install -r requirements-docs.txt
    build:
      html:
        - mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: mkdocs.yml
